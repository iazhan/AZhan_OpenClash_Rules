[custom]

; ------------------------------------------------------------------------------
; 1. 规则集定义 (优先级由上到下，命中即止)
; ------------------------------------------------------------------------------

; [1.1 局域网与私有地址直连]
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

; [1.2 自定义直连优化与 CDN 直连]
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.mrs,1800
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,clash-domain:https://cdn.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Game_Download_CDN_Domain.mrs,28800
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; [1.3 国内 AI 直连 (VPSDance cn.yaml: Kimi、DeepSeek、智谱等)]
ruleset=🎯 全球直连,clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/cn.yaml,86400

; [1.4 海外 AI 服务独立分流 (优先于通用业务匹配)]
ruleset=🤖 Gemini,clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/google-ai.yaml,86400
ruleset=🤖 ChatGPT,clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/openai.yaml,86400
ruleset=🤖 Claude,clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/anthropic.yaml,86400
ruleset=🤖 AI服务,clash-classic:https://cdn.jsdelivr.net/gh/VPSDance/ai-proxy-rules@main/rules/clash/global.yaml,86400

; [1.5 常用海外业务分流]
ruleset=💬 即时通讯,[]GEOSITE,category-communication
ruleset=💬 即时通讯,[]GEOIP,telegram,no-resolve
ruleset=📹 YouTube,[]GEOSITE,youtube
ruleset=🎥 国外媒体,[]GEOSITE,netflix
ruleset=🎥 国外媒体,[]GEOIP,netflix,no-resolve
ruleset=🎥 国外媒体,[]GEOSITE,disney
ruleset=🎥 国外媒体,[]GEOSITE,spotify
ruleset=🎥 国外媒体,[]GEOSITE,category-entertainment
ruleset=🚀 GitHub,[]GEOSITE,github
ruleset=📢 谷歌FCM,[]GEOSITE,googlefcm
ruleset=🇬 谷歌服务,[]GEOSITE,google
ruleset=🇬 谷歌服务,[]GEOIP,google,no-resolve
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=🎮 游戏平台,[]GEOSITE,steam
ruleset=🎮 游戏平台,[]GEOSITE,category-games
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest

; [1.6 GFW 规则兜底]
ruleset=🚀 手动选择,[]GEOSITE,gfw

; [1.7 国内域名与 IP 直连兜底]
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

; [1.8 最终漏网之鱼]
ruleset=🐟 漏网之鱼,[]FINAL


