# ==============================================================================
# AZhan_OpenClash_Rules - 自定义 OpenClash 订阅转换模板
# 特性：16 个国家地区独立分流 + GPT 专线测速 + Gemini/ChatGPT/Claude 专属 AI 分流
# 项目路径：D:\Projects\Codex\AZhan_OpenClash_Rules
